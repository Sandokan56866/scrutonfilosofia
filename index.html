<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cortador de Vídeo - Desktop</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>Cortador de Vídeo (Manual)</h1>

    <section class="panel">
      <h2>Vídeo</h2>
      <label for="videoInput">Selecione um vídeo local</label>
      <input id="videoInput" type="file" accept="video/*" />
      <video id="video" controls></video>
    </section>

    <section class="panel grid">
      <div>
        <h2>Corte</h2>
        <label for="startTime">Início (mm:ss ou ss)</label>
        <input id="startTime" type="text" placeholder="00:10" />

        <label for="endTime">Fim (mm:ss ou ss)</label>
        <input id="endTime" type="text" placeholder="00:40" />

        <button id="previewCutBtn">Pré-visualizar corte</button>
      </div>

      <div>
        <h2>Legenda manual</h2>
        <label for="captionText">Texto da legenda</label>
        <textarea id="captionText" rows="4" placeholder="Digite aqui a legenda..."></textarea>

        <label for="fontFamily">Fonte</label>
        <select id="fontFamily">
          <option>Arial</option>
          <option>Verdana</option>
          <option>Tahoma</option>
          <option>Georgia</option>
          <option>Courier New</option>
        </select>

        <label for="fontSize">Tamanho</label>
        <input id="fontSize" type="range" min="14" max="64" value="32" />

        <label for="captionX">Posição horizontal (%)</label>
        <input id="captionX" type="range" min="0" max="100" value="50" />

        <label for="captionY">Posição vertical (%)</label>
        <input id="captionY" type="range" min="0" max="100" value="85" />
      </div>
    </section>

    <section class="panel">
      <h2>Configuração gerada</h2>
      <button id="generateBtn">Gerar JSON da edição</button>
      <pre id="output">Aguardando configuração...</pre>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
